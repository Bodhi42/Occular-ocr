[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "occular-decode"
version = "0.1.0"
description = "Нативный CTC beam-search декодер с n-gram LM для Occular-OCR"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
# abi3: одно колесо на платформу покрывает все версии Python начиная с 3.8
features = ["pyo3/extension-module"]
strip = true
