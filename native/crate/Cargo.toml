[package]
name = "occular-decode"
version = "0.1.0"
edition = "2021"

[lib]
name = "occular_decode"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py38"] }
numpy = "0.24"
rayon = "1.10"
rustc-hash = "2.1"
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
